<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
</head>
<body>

    <h2>
        Name: Samarth Bhatnagar <br>
        Registration No: 24BCI0082
    </h2>

    <h3>Simple Calculator</h3>

    Number 1: <input type="number" id="num1" step="any"><br><br>
    Number 2: <input type="number" id="num2" step="any"><br><br>

    <!-- Buttons -->
    <button onclick="calculate('add')">Add</button>
    <button onclick="calculate('sub')">Subtract</button>
    <button onclick="calculate('mul')">Multiply</button>
    <button onclick="calculate('div')">Divide</button>

    <h3 id="result"></h3>

    <script>
        function calculate(operation) {

            // Get values and convert using parseFloat()
            var number1 = parseFloat(document.getElementById("num1").value);
            var number2 = parseFloat(document.getElementById("num2").value);

            var result;

            // Switch statement
            switch(operation) {
                case 'add':
                    result = number1 + number2;
                    break;

                case 'sub':
                    result = number1 - number2;
                    break;

                case 'mul':
                    result = number1 * number2;
                    break;

                case 'div':
                    // Division by zero handling
                    if (number2 === 0) {
                        document.getElementById("result").innerHTML = "Error: Division by zero!";
                        return;
                    }
                    result = number1 / number2;
                    break;

                default:
                    result = "Invalid operation";
            }

            // Display result
            document.getElementById("result").innerHTML = "Result: " + result;
        }
    </script>

</body>
</html>
