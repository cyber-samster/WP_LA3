<!DOCTYPE html>
<html>
<head>
    <title>Student Information System</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        h2 {
            text-align: center;
        }

        form {
            background: white;
            padding: 15px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input, select, button {
            width: 100%;
            margin: 5px 0;
            padding: 8px;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
        }

        table, th, td {
            border: 1px solid black;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>
        Name: Samarth Bhatnagar <br>
        Registration No: 24BCI0082
    </h2>

    <h2>Student Information System</h2>

    <!-- Form -->
    <form id="studentForm">
        Name: <input type="text" name="name" required>
        Age: <input type="number" name="age" required>
        Course:
        <select name="course">
            <option value="B.Tech">B.Tech</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
        </select>

        <button type="button" onclick="addStudent(this.form)">Add Student</button>
    </form>

    <!-- Table -->
    <table id="studentTable">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>
    </table>

    <script>
        // Global array (stores students)
        var students = [];

        // Constructor-like object
        function Student(name, age, course) {
            this.name = name;
            this.age = age;
            this.course = course;

            // Object method using this
            this.getDetails = function() {
                return this.name + " - " + this.age + " - " + this.course;
            };
        }

        // Function to add student
        function addStudent(form) {

            // Form handling
            var name = form.elements["name"].value;
            var age = form.elements["age"].value;
            var course = form.elements["course"].value;

            // Create object
            var studentObj = new Student(name, age, course);

            // Store in array
            students.push(studentObj);

            // Update table dynamically
            displayStudents();

            // Reset form
            form.reset();

            // Focus back to first field
            form.elements["name"].focus();
        }

        // Function to display students
        function displayStudents() {
            var table = document.getElementById("studentTable");

            // Clear old rows except header
            table.innerHTML = `
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Course</th>
                </tr>
            `;

            // Loop through array
            for (var i = 0; i < students.length; i++) {
                var row = "<tr>" +
                    "<td>" + students[i].name + "</td>" +
                    "<td>" + students[i].age + "</td>" +
                    "<td>" + students[i].course + "</td>" +
                    "</tr>";

                table.innerHTML += row;
            }
        }
    </script>

</body>
</html>
