<!DOCTYPE html>
<html>
<head>
    <title>Overlapping Image Gallery</title>
    <style>
        .container {
            position: relative;
            width: 500px;
            height: 400px;
            border: 2px solid black;
        }

        .imgBox {
            position: absolute;
            width: 150px;
            height: 150px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Initial overlapping positions */
        #img1 { top: 20px; left: 20px; }
        #img2 { top: 60px; left: 80px; }
        #img3 { top: 100px; left: 140px; }
    </style>
</head>
<body>

    <h2>Overlapping Image Gallery</h2>

    <div style="font-weight: bold; margin-bottom: 10px;">
        Name: Samarth Bhatnagar <br>
        Registration Number: 24BCI0082
    </div>

    <fieldset>
        <legend>Click any image to bring it to front</legend>

        <div class="container">
            <img src="https://picsum.photos/150?1" id="img1" class="imgBox" onclick="bringToFront(this)">
            <img src="https://picsum.photos/150?2" id="img2" class="imgBox" onclick="bringToFront(this)">
            <img src="https://picsum.photos/150?3" id="img3" class="imgBox" onclick="bringToFront(this)">
        </div>

    </fieldset>

    <script>
        // Global variable to track highest z-index
        let topIndex = 1;

        function bringToFront(element) {
            // Increment z-index using prefix ++
            element.style.zIndex = ++topIndex;
        }
    </script>

</body>
</html>
