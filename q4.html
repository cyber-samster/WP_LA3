<!DOCTYPE html>

    <title>Area of Rectangle</title>
</head>
<body>

    <h2>
        Name: Samarth Bhatnagar <br>
        Registration No: 24BCI0082
    </h2>

    <h3>Area of Rectangle Calculation</h3>

    <p id="output"></p>

    <script>
        // Integer values
        var lengthValue = 10;
        var widthValue = 5;

        var areaResult = lengthValue * widthValue;

        // Floating point values (loose typing)
        lengthValue = 10.5;
        widthValue = 5.2;

        var floatAreaResult = lengthValue * widthValue;

        // Display results using innerHTML
        document.getElementById("output").innerHTML =
            "Integer Area: " + areaResult + "<br>" +
            "Floating Point Area: " + floatAreaResult;
    </script>

</body>
</html>
